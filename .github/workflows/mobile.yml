# Builds the ITE store app on every push that changes the console or the mobile project.
#  - Android: a debug APK to install on test phones, and (when the signing secrets are set) a signed release
#    App Bundle (.aab) for Google Play. Both are attached to the run as downloadable artifacts.
#  - iOS: builds the Xcode project for the simulator to prove it compiles. Signed builds for TestFlight and the
#    App Store are made in Xcode on a Mac (see mobile/README.md).
name: Mobile app
on:
  push:
    branches: [main, pulse-into-ite]
    paths: ["index.html", "app/icons/**", "mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    env:
      ITE_VERSION_CODE: ${{ github.run_number }}
      ITE_VERSION_NAME: 1.0.${{ github.run_number }}
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build && npx cap sync android
      - name: Debug APK (for test phones)
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: ite-android-debug-apk, path: mobile/android/app/build/outputs/apk/debug/*.apk }
      - name: Signed release bundle (Google Play)
        if: ${{ env.HAS_KEY == 'true' }}
        working-directory: mobile/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ITE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ITE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ITE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ITE_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('mobile/android/app/build/outputs/bundle/release/*.aab') != '' }}
        with: { name: ite-android-release-aab, path: mobile/android/app/build/outputs/bundle/release/*.aab }
  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npm run build && npx cap sync ios
      - name: Build for the simulator (no signing)
        working-directory: mobile/ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -20
