<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>TTE Mobile</title>
<style>
:root{--bg:#060B14;--card:#0E1624;--card2:#142033;--line:#1F2C40;--text:#E8EEF7;--muted:#8A97AB;--teal:#34D8C0;--red:#FF5468;--amber:#FFB547;--green:#3DDC97;--blue:#5B9BD5;--violet:#B07CFF;--tab:72px;--safe:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root{--bg:#F3F5F9;--card:#FFFFFF;--card2:#EEF2F7;--line:#D9E0EA;--text:#0E1624;--muted:#5B6678;--teal:#0E9F8B;--red:#D92D45;--amber:#B26A00;--green:#1B8A57;--blue:#2F6FB0;--violet:#7A4CD9}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--teal)}
#top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#top .brand{font-weight:800;letter-spacing:.04em}#top .scope{display:flex;flex-direction:column;min-width:0;flex:1}#top .scope small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 10px}.sync i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.me{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card2);font-weight:700}
main{padding:14px 16px calc(var(--tab) + var(--safe) + 20px);max-width:640px;margin:0 auto}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.card.hot{border-color:color-mix(in srgb,var(--red) 60%,var(--line));box-shadow:0 0 0 1px color-mix(in srgb,var(--red) 30%,transparent)}
.card.seen{opacity:.55}
.row{display:flex;align-items:center;gap:8px}.row .sp{flex:1}
.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:999px;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent)}
.t{font-weight:700;font-size:15.5px;margin:6px 0 2px}.s{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-weight:600}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#04201B}.btn.red{background:var(--red);border-color:var(--red);color:#fff}.btn.ghost{background:none}
.btn.big{width:100%;min-height:56px;font-size:17px;border-radius:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btns .btn{flex:1 1 auto}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:4px}
.ok{--c:var(--green)}
label.f{display:block;margin:12px 0 4px;font-size:13px;color:var(--muted)}
input.i,select.i,textarea.i{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:16px}
textarea.i{min-height:96px;resize:vertical}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choices.one{grid-template-columns:1fr}
.choice{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:10px 12px;text-align:left;font-weight:600}
.choice small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.choice[aria-pressed="true"]{border-color:var(--c,var(--teal));background:color-mix(in srgb,var(--c,var(--teal)) 14%,var(--card));box-shadow:inset 0 0 0 1px var(--c,var(--teal))}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}.seg button{flex:1;min-height:38px;border:0;background:none;border-radius:9px;font-weight:600;color:var(--muted)}.seg button[aria-pressed="true"]{background:var(--card2);color:var(--text)}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:var(--safe)}
#tabs button{flex:1;height:var(--tab);border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11.5px;font-weight:600;position:relative}
#tabs button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#tabs button[aria-current="page"]{color:var(--teal)}
#tabs button.rep{color:#fff}#tabs button.rep span.ic{width:48px;height:48px;border-radius:50%;background:var(--red);display:grid;place-items:center;margin-top:-18px;box-shadow:0 6px 18px color-mix(in srgb,var(--red) 45%,transparent)}#tabs button.rep span.lb{color:var(--muted)}#tabs button.rep[aria-current="page"] span.lb{color:var(--red)}
#tabs .bd{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;line-height:18px}
#sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}#sheet[hidden]{display:none}
#sheet .in{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;border:1px solid var(--line);padding:18px 16px calc(18px + var(--safe))}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 12px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(var(--tab) + var(--safe) + 12px);z-index:30;display:flex;justify-content:center;pointer-events:none}
#toast div{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:520px;pointer-events:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:8px 0}.kv dt{color:var(--muted)}.kv dd{margin:0}
.step{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.step input{width:22px;height:22px;margin-top:2px}
.big2{font-size:24px;font-weight:800}.shift{border-left:5px solid var(--c)}
.photo{max-width:100%;border-radius:12px;margin-top:8px}
.art{font:16px/1.65 Georgia,"Times New Roman",serif}.art h1{font-size:23px;line-height:1.3}.art h2{font-family:inherit;text-transform:none;letter-spacing:0;color:var(--text);font-size:17px}.art sup a{text-decoration:none}.art .refs{font:13px/1.5 -apple-system,"Segoe UI",sans-serif;color:var(--muted)}.art .refs li{margin:6px 0;word-break:break-word}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--c)}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
.offline{background:color-mix(in srgb,var(--amber) 14%,var(--card));border:1px solid color-mix(in srgb,var(--amber) 50%,var(--line));border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
@media (prefers-reduced-motion:no-preference){.card,.choice,.btn{transition:transform .08s}.btn:active,.choice:active{transform:scale(.98)}}
</style>
</head>
<body>
<header id="top"></header>
<main id="view" aria-live="polite"></main>
<nav id="tabs" aria-label="Sections"></nav>
<div id="sheet" hidden role="dialog" aria-modal="true"><div class="in" id="sheetIn"></div></div>
<div id="toast" aria-live="assertive"></div>
<script>window.TTE_SITES = /*SITES*/[];</script>
<script>
/* TTE Mobile: the light phone app. It shares the console's data (the same stores, through the PSOC server, or this browser's
   storage when the console is open on the same device) and does only what a phone is for: what needs me now, reporting to the
   PSOC, shift and patrol, decisions, and reading briefs. Everything else is in the web console. */
"use strict";
const $ = (s, r) => (r || document).querySelector(s), $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ls = (k, d) => { try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } };
const lss = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } };
const nid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const ago = t => { if (!t) return ""; const m = Math.round((Date.now() - t) / 60e3); return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " d ago"; };
const fmt = (t, tz) => { try{ return new Intl.DateTimeFormat("en-GB", { timeZone: tz || undefined, weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).format(t); }catch(e){ return new Date(t).toLocaleString(); } };
const hm = (t, tz) => { try{ return new Intl.DateTimeFormat("en-GB", { timeZone: tz || undefined, hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).format(t); }catch(e){ return ""; } };
const trunc = (s, n) => { s = String(s || ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
/* ---------- the shared stores ---------- */
const KEY = t => "psoc.uni." + t + ".v1", OUTK = "psoc.lite.outbox.v1";
const TYPES = ["actions", "incidents", "patrolrel", "patrolfb", "opdec", "shifts", "guards", "hsimpact", "articles", "cvalerts", "vgvisit", "vgkeys", "mobdigest", "users"];
const DB = {}; let OUT = ls(OUTK, []) || [];
const SYNC = { ok: null, at: 0, err: "" };
function load(){ TYPES.forEach(t => { const v = ls(KEY(t), []); DB[t] = Array.isArray(v) ? v : []; }); }
const live = t => (DB[t] || []).filter(x => x && !x.deleted);
const CFG = () => Object.assign({ server: "", hotline: "", notify: false }, ls("psoc.lite.cfg.v1", {}));
function server(){ if (window.__PSOC_SERVER && /^https?:$/.test(location.protocol)) return location.origin; const c = CFG(); if (c.server) return c.server.replace(/\/+$/, ""); const k = ls("psoc.uni.settings.v1", {}) || {}; return String(k.serverUrl || "").replace(/\/+$/, ""); }
function put(t, rec){ rec.updatedAt = Date.now(); if (!rec.createdAt) rec.createdAt = rec.updatedAt; const L = ls(KEY(t), []) || [], i = L.findIndex(x => x.id === rec.id); if (i >= 0) L[i] = rec; else L.unshift(rec);
  if (!lss(KEY(t), L)) lss(KEY(t), L.slice(0, 300)); DB[t] = L; OUT.push({ t, rec }); lss(OUTK, OUT); flush(); }
let flushing = false;
async function flush(){ const base = server(); if (!base || flushing || !OUT.length){ status(); return; } flushing = true;
  while (OUT.length){ const o = OUT[0]; try{ const r = await fetch(base + "/api/items/" + o.t, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(o.rec) }); if (!r.ok) throw new Error("HTTP " + r.status); OUT.shift(); lss(OUTK, OUT); SYNC.ok = true; SYNC.at = Date.now(); }
    catch(e){ SYNC.ok = false; SYNC.err = e.message; break; } } flushing = false; status(); }
let pulling = false;
async function pull(){ const base = server(); if (!base){ load(); render(); return; } if (pulling) return; pulling = true; let ok = 0;
  await Promise.all(TYPES.map(async t => { try{ const r = await fetch(base + "/api/items/" + t, { cache: "no-store" }); if (!r.ok) return; const remote = await r.json(); if (!Array.isArray(remote)) return;
      const m = new Map((ls(KEY(t), []) || []).map(x => [x.id, x])); remote.forEach(x => { if (!x || !x.id) return; const l = m.get(x.id); if (!l || (x.updatedAt || 0) > (l.updatedAt || 0)) m.set(x.id, x); });
      const L = [...m.values()].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 1500); if (!lss(KEY(t), L)) lss(KEY(t), L.slice(0, 300)); ok++; }catch(e){} }));
  pulling = false; SYNC.ok = ok > 0; SYNC.at = ok ? Date.now() : SYNC.at; if (!ok) SYNC.err = "the PSOC server did not answer"; load(); render(); alertNew(); flush(); }
/* ---------- sites and scope ---------- */
const TZ = { Japan: "Asia/Tokyo", "South Korea": "Asia/Seoul", Korea: "Asia/Seoul", China: "Asia/Shanghai", "Hong Kong": "Asia/Hong_Kong", Taiwan: "Asia/Taipei", Singapore: "Asia/Singapore", Malaysia: "Asia/Kuala_Lumpur", Indonesia: "Asia/Jakarta", Thailand: "Asia/Bangkok", Philippines: "Asia/Manila", Vietnam: "Asia/Ho_Chi_Minh", India: "Asia/Kolkata", Australia: "Australia/Sydney", "New Zealand": "Pacific/Auckland" };
const digest = () => (live("mobdigest").find(x => x.id === "digest")) || null;
function sites(){ const d = digest(); if (d && Array.isArray(d.sites) && d.sites.length) return d.sites.map(a => ({ code: a[0], city: a[1], country: a[2], region: a[3], lat: a[4], lon: a[5], office: !!a[6], tz: a[7] || TZ[a[2]] }));
  const loc = ls("psoc.uni.sites.v1", null), L = Array.isArray(loc) && loc.length ? loc : (window.TTE_SITES || []);
  return L.filter(s => s && s.code && !/closed|decom/i.test(s.status || "")).map(s => ({ code: s.code, city: s.city, country: s.country, region: s.region, lat: s.lat, lon: s.lon, office: /office/i.test((s.src || "") + (s.cls || "")), tz: TZ[s.country] || "Asia/Singapore" })); }
const site = code => sites().find(s => s.code === code) || null;
let ME = ls("psoc.uni.me.v1", null), PROF = ls("psoc.lite.prof.v1", null);
const ROLES = { guard: ["Security guard", "Your shift, patrol taskings and your site"], ssm: ["Site security manager", "Your site: alerts, people on post, decisions"], dsom: ["Country (DSOM)", "Your country's sites and decisions"], rsom: ["Region (RSOM)", "Your region's sites and decisions"], dir: ["APAC director", "Decisions needed and what matters across APAC"], psoc: ["PSOC officer", "The action queue and every site, on the go"] };
function allowedRoles(){ const u = ME && live("users").find(x => x.id === "u:" + String(ME.name).toLowerCase()), r = u ? u.role : ""; if (r === "patrol") return ["guard"]; if (r === "leader") return ["dir"]; return Object.keys(ROLES); }
function scopeSites(){ const p = PROF || {}, S = sites(); if (p.role === "guard" || p.role === "ssm") return S.filter(s => s.code === p.site); if (p.role === "dsom") return S.filter(s => s.country === p.country); if (p.role === "rsom") return S.filter(s => s.region === p.region); return S; }
const wide = () => PROF && (PROF.role === "dir" || PROF.role === "psoc");
function inScope(code, city, country){ if (wide()) return true; const S = scopeSites(); return S.some(s => s.code === code || (city && s.city === city) || (!code && !city && country && s.country === country)); }
function scopeLabel(){ const p = PROF || {}; return p.role === "guard" || p.role === "ssm" ? (p.site || "") + (site(p.site) ? " · " + site(p.site).city : "") : p.role === "dsom" ? p.country : p.role === "rsom" ? p.region : "All of APAC"; }
/* ---------- what needs me now ---------- */
const ACKS = () => ls("psoc.lite.ack.v1", {});
const KIND = { task: ["Tasking", "var(--red)"], action: ["Action", "var(--amber)"], ask: ["Decision needed", "var(--blue)"], inc: ["Incident", "var(--red)"], warn: ["Warning", "var(--amber)"], impact: ["Impact", "var(--amber)"], dmg: ["Satellite damage", "var(--red)"], cam: ["Camera", "var(--violet)"], posture: ["Site posture", "var(--blue)"] };
const LV = ["Watch", "Moderate", "High", "Severe"];
function nowItems(){ const out = [], me = ME ? ME.name : "", role = PROF ? PROF.role : "", now = Date.now(), add = o => out.push(o);
  live("patrolrel").filter(r => r.status === "open" && (r.officers || []).includes(me)).forEach(r => { const acked = live("patrolfb").some(f => f.relId === r.id && f.kind === "ack" && f.officer === me);
    add({ key: "task:" + r.id, k: "task", hot: !acked, t: r.title || "Tasking from the PSOC", s: (r.msg || "") + " · " + ago(r.createdAt), at: r.createdAt, open: () => taskSheet(r.id), done: acked }); });
  if (role !== "guard") live("actions").filter(a => a.status === "pending" && (role === "psoc" || wide() || inScope(a.site, a.city))).forEach(a => add({ key: "act:" + a.id, k: "action", hot: a.pri === "P1" || a.pri === "P2", pri: a.pri, t: a.title, s: [a.source, a.site, ago(a.createdAt)].filter(Boolean).join(" · "), at: a.createdAt, open: () => actionSheet(a.id), done: !!a.claimedBy && a.claimedBy === me }));
  if (role !== "guard") opdOpen().forEach(({ r, a }) => add({ key: "ask:" + r.id + ":" + a.id, k: "ask", hot: true, t: a.text, s: r.title + (r.country ? " · " + r.country : ""), at: r.lastAt || r.createdAt, open: () => go("decide") }));
  live("incidents").filter(x => x.status !== "resolved" && x.site && inScope(x.site)).forEach(x => add({ key: "inc:" + x.id, k: "inc", hot: /^[12]$/.test(String(x.sev)), t: (x.id ? x.id + " " : "") + (x.title || "Incident"), s: `SEV ${x.sev || "?"} · ${x.status || "open"} · ${ago(x.createdAt)}`, at: x.lastAt || x.createdAt, open: () => incSheet(x.id) }));
  const d = digest(); if (d){ (d.warn || []).filter(w => (!w.end || w.end > now) && (wide() ? /extreme|severe/i.test(w.sev || "") : (w.cities || []).some(c => scopeSites().some(s => s.city === c)))).slice(0, 12).forEach(w => add({ key: "warn:" + (w.id || w.t), k: "warn", hot: /extreme/i.test(w.sev || ""), t: w.t, s: [w.area, w.src, w.end ? "until " + fmt(w.end) : ""].filter(Boolean).join(" · "), at: w.at || d.at }));
    (d.impact || []).filter(x => x.level >= (wide() ? 3 : role === "dsom" || role === "rsom" ? 2 : 1) && inScope(x.code)).slice(0, 15).forEach(x => add({ key: "imp:" + x.code + ":" + x.level + ":" + x.why, k: "impact", hot: x.level >= 3, t: `${LV[x.level]} impact at ${x.code}`, s: x.why, at: d.at })); }
  live("hsimpact").forEach(S => (S.sites || []).filter(x => x.level >= (wide() ? 2 : 1) && inScope(x.code)).forEach(x => add({ key: "dmg:" + S.id + ":" + x.code + ":" + x.d1, k: "dmg", hot: x.level >= 2, t: `${LV[x.level]} damage around ${x.code}`, s: `${x.d1} buildings damaged within ${S.km || 1} km · ${S.event || S.name}`, at: S.at, open: () => damageSheet(S.id) })));
  if (role === "guard" || role === "ssm" || role === "psoc") live("cvalerts").filter(a => a.status === "new" && !a.test && !a.practice && inScope(a.site)).slice(0, 8).forEach(a => add({ key: "cam:" + a.id, k: "cam", hot: true, t: (a.title || a.type || "Camera alarm") + (a.camName ? " · " + a.camName : ""), s: [a.site, a.detail, ago(a.createdAt)].filter(Boolean).join(" · "), at: a.createdAt, img: a.snap }));
  if (role === "guard" || role === "ssm") live("opdec").filter(r => r.status !== "closed" && scopeSites().some(s => s.country === r.country)).forEach(r => { const mine = (r.posture || []).filter(p => !(p.sites || []).length || (p.sites || []).some(c => inScope(c))); if (mine.length) add({ key: "pos:" + r.id + ":" + (r.lastAt || 0), k: "posture", t: r.title, s: mine.map(p => `${p.area}: ${p.text || p.state}`).join(" · "), at: r.lastAt || r.createdAt }); });
  const A = ACKS(); out.forEach(o => { o.seen = !!A[o.key] || o.done; });
  return out.sort((a, b) => (a.seen - b.seen) || (b.hot - a.hot) || (b.at || 0) - (a.at || 0)); }
function opdOpen(){ const me = ME ? ME.name : ""; return live("opdec").filter(r => r.status !== "closed" && (wide() || scopeSites().some(s => s.country === r.country))).flatMap(r => (r.asks || []).filter(a => !(a.answers || []).some(x => x.final) && !(a.answers || []).some(x => x.by === me)).map(a => ({ r, a }))); }
/* ---------- screens ---------- */
let TAB = "now", SEG = ls("psoc.lite.seg.v1", {}) || {};
const IC = { now: '<path d="M12 3a6 6 0 0 0-6 6v4l-2 3h16l-2-3V9a6 6 0 0 0-6-6z"/><path d="M10 19a2 2 0 0 0 4 0"/>', report: '<path d="M12 5v14M5 12h14"/>', shift: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>', decide: '<path d="M9 11l3 3 7-7"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/>', read: '<path d="M4 5h6a3 3 0 0 1 3 3v11a2 2 0 0 0-2-2H4z"/><path d="M20 5h-6a3 3 0 0 0-3 3v11a2 2 0 0 1 2-2h7z"/>' };

  if (t.id === "rpSite") REP.site = t.value; if (t.id === "rpGeo") REP.geo = t.checked; });
document.addEventListener("input", e => { if (e.target.id === "rpDesc") REP.desc = e.target.value; });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); if ((e.key === "Enter" || e.key === " ") && e.target.matches("[role=button]")){ e.preventDefault(); e.target.click(); } });
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });
/* ---------- in the store app (Capacitor): shift reminders, haptics, the Android back button, status bar and push ---------- */
const NATIVE = { on: !!(window.Capacitor && typeof Capacitor.isNativePlatform === "function" && Capacitor.isNativePlatform()) };
const plug = n => { try{ return (window.Capacitor && Capacitor.Plugins && Capacitor.Plugins[n]) || null; }catch(e){ return null; } };
const hsh = s => { let h = 7; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) | 0; return Math.abs(h) % 2000000000; };
async function reminders(){ const LN = plug("LocalNotifications"), g = ME && myGuard(); if (!LN || !g) return; NATIVE.remAt = Date.now();
  try{ const p = await LN.checkPermissions(); if (p.display !== "granted"){ const r = await LN.requestPermissions(); if (r.display !== "granted") return; } }catch(e){}
  const now = Date.now(), notes = live("shifts").filter(x => x.guard === g.id && (x.st === "planned" || x.st === "confirmed")).map(x => Object.assign({ T: shiftTimes(x) }, x)).filter(x => x.T[0] - 3600e3 > now && x.T[0] - now < 7 * 864e5)
    .map(x => ({ id: hsh(x.id), title: `Shift at ${x.site} in 1 hour`, body: `${x.post || "Post"} · ${(SH[x.k] || SH.D)[0]} shift starts ${hm(x.T[0], x.T[2])}${x.st === "planned" ? " — please confirm" : ""}`, schedule: { at: new Date(x.T[0] - 3600e3), allowWhileIdle: true }, extra: { go: "shift" } }));
  try{ const pend = await LN.getPending(), old = (pend.notifications || []).filter(n => n.extra && n.extra.go === "shift"); if (old.length) await LN.cancel({ notifications: old.map(n => ({ id: n.id })) }); if (notes.length) await LN.schedule({ notifications: notes }); }catch(e){} }
async function nativePush(){ const PN = plug("PushNotifications"), d = digest(); if (!PN || !d || !d.push || NATIVE.push) return; NATIVE.push = true;
  try{ const r = await PN.requestPermissions(); if (r.receive !== "granted") return; PN.addListener("registration", t => { const base = server(); if (base) fetch(base + "/api/push/register", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: t.value, platform: Capacitor.getPlatform(), user: ME ? ME.name : "", profile: PROF ? PROF.role : "" }) }).catch(() => {}); });
    PN.addListener("pushNotificationActionPerformed", a => { const g = a && a.notification && a.notification.data && (a.notification.data.go || a.notification.data.mode); if (g) go({ "m-alerts": "now", "wf-duty": "shift", patrol: "shift", "m-dec": "decide" }[g] || (["now", "report", "shift", "decide", "read"].includes(g) ? g : "now")); }); await PN.register(); }catch(e){} }
function nativeInit(){ if (!NATIVE.on || NATIVE.init) return; NATIVE.init = true; document.documentElement.classList.add("native"); try{ localStorage.setItem("ite.installhint", "1"); }catch(e){}
  const SB = plug("StatusBar"), SP = plug("SplashScreen"), APP = plug("App"), LN = plug("LocalNotifications"), HP = plug("Haptics");
  try{ SB && SB.setStyle({ style: "DARK" }); SB && SB.setBackgroundColor && SB.setBackgroundColor({ color: "#060B14" }); }catch(e){} try{ SP && SP.hide(); }catch(e){}
  try{ APP && APP.addListener("backButton", () => { if (!$("#sheet").hidden){ closeSheet(); return; } if (TAB !== "now"){ go("now"); return; } APP.exitApp && APP.exitApp(); }); }catch(e){}
  try{ APP && APP.addListener("resume", () => { pull(); reminders(); }); }catch(e){}
  try{ LN && LN.addListener("localNotificationActionPerformed", a => { const g = a && a.notification && a.notification.extra && a.notification.extra.go; if (g) go(g); }); }catch(e){}
  document.addEventListener("click", e => { if (HP && e.target.closest("[data-clock],[data-send],[data-ans],[data-decgo],[data-tack],[data-confirm]")) try{ HP.impact({ style: "MEDIUM" }); }catch(x){} }, true);
  setTimeout(() => { reminders(); nativePush(); }, 2500); setInterval(() => { if (Date.now() - (NATIVE.remAt || 0) > 10 * 60e3) reminders(); nativePush(); }, 60e3); }
/* ---------- start ---------- */
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); window.__teBip = e; document.dispatchEvent(new Event("te-installable")); });
window.addEventListener("storage", e => { if (e.key && /^psoc\.uni\./.test(e.key)){ load(); if ($("#sheet").hidden) render(); } });
window.addEventListener("online", () => { flush(); pull(); }); window.addEventListener("offline", status);
document.addEventListener("visibilitychange", () => { if (!document.hidden) pull(); });
{ const q = new URLSearchParams(location.search).get("go") || location.hash.slice(1), map = { alerts: "now", "m-alerts": "now", flag: "report", "@flag": "report", patrol: "shift", "wf-duty": "shift", "m-dec": "decide", decisions: "decide" }; const t = map[q] || q; if (["now", "report", "shift", "decide", "read"].includes(t)) TAB = t; }
load(); render(); pull(); nativeInit(); setInterval(() => { if (!document.hidden) pull(); }, 30000); setInterval(status, 15000);
