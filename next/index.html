<meta name="robots" content="noindex, nofollow">

<style>@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:400;font-display:swap;src:url(vendor/plex-sans-400.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:500;font-display:swap;src:url(vendor/plex-sans-500.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:600;font-display:swap;src:url(vendor/plex-sans-600.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans Condensed";font-style:normal;font-weight:500;font-display:swap;src:url(vendor/plex-cond-500.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(vendor/plex-cond-600.woff2) format("woff2")}
/* ITE — design tokens
   Night (default, the watch floor) and Day. Severity is the only loud colour: the four tiers run from sea green
   through amber and orange to red, so anything coloured on screen means "this level of concern". Interaction is
   signal blue. Panels are flat; borders mean containment; floating things (dialogs, toasts) get the only shadow. */
:root{
  --bg:#0F1B26; --panel:#142330; --raise:#1A2C3B; --rule:#27394A; --rule2:#33495C; --text:#E3EAF0; --muted:#8FA3B4; --faint:#5F7486;
  --signal:#5AA9E6; --signal-ink:#08131C; --t0:#3BA58F; --t1:#D8B24A; --t2:#E27D3C; --t3:#DA4453; --ok:#3BA58F;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --r:4px; --r2:7px; --pane:500px; --rail:84px; --top:52px;
  color-scheme:dark;
}
:root[data-theme="day"]{
  --bg:#E9EEF2; --panel:#FFFFFF; --raise:#F4F7F9; --rule:#D5DEE5; --rule2:#C2CED8; --text:#13212C; --muted:#536877; --faint:#8396A4;
  --signal:#1C6BAE; --signal-ink:#FFFFFF; --t0:#23826F; --t1:#A9821A; --t2:#C25B17; --t3:#B8283A; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:400 13.5px/1.45 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--signal)}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
[hidden]{display:none !important}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ---------- frame ---------- */
.app{display:grid;grid-template-columns:var(--rail) 1fr;grid-template-rows:var(--top) 1fr;height:100vh;overflow:hidden}
.rail{grid-row:1 / 3;background:var(--panel);border-right:1px solid var(--rule);display:flex;flex-direction:column;align-items:stretch;padding:10px 0 8px;gap:2px;overflow-y:auto}
.top{display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--rule);background:var(--panel);min-width:0}
.work{display:grid;grid-template-columns:1fr var(--pane);min-height:0}
.work.full{grid-template-columns:1fr}.work.full .mapcell{display:none}
.mapcell{position:relative;min-width:0;border-right:1px solid var(--rule)}
#map{position:absolute;inset:0;background:var(--bg)}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg)}

/* ---------- rail: the workflow spine ----------
   Watch, Inbox, Events, Reports are joined by a line because they are one sequence; Sites and Settings sit apart. */
.brand{display:flex;flex-direction:column;align-items:center;margin:0 0 12px}
.brand b{font:600 17px var(--cond);letter-spacing:.06em}.brand span{font:500 10.5px var(--cond);color:var(--muted)}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;border:0;background:none;cursor:pointer;color:var(--muted);font:500 11.5px var(--cond)}
.stage .node{position:relative;z-index:1;min-width:34px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;background:var(--raise);border:1px solid var(--rule2);color:var(--text);font:600 14px var(--font);padding:0 8px}
.stage .node.zero{color:var(--faint)}
.stage .node.t1{border-color:var(--t1)}.stage .node.t2{background:color-mix(in srgb,var(--t2) 22%,var(--raise));border-color:var(--t2)}.stage .node.t3{background:var(--t3);border-color:var(--t3);color:#fff}
.stage.flow + .stage.flow::before{content:"";position:absolute;top:-12px;left:50%;width:1px;height:22px;background:var(--rule2)}
.stage[aria-current="page"]{color:var(--text)}.stage[aria-current="page"] .node{outline:2px solid var(--signal);outline-offset:2px}
.stage:hover{color:var(--text)}
.rail .gap{flex:1;min-height:16px}
.me{margin:6px auto 0;width:34px;height:34px;border-radius:17px;border:1px solid var(--rule2);background:none;color:var(--muted);font:600 12px var(--font);cursor:pointer}

/* ---------- top bar: the one next thing to do, then health and clocks ---------- */
.next{display:flex;align-items:center;gap:10px;min-width:0;flex:1;border:0;background:none;padding:6px 10px;border-radius:var(--r2);text-align:left;cursor:pointer}
.next:hover{background:var(--raise)}
.feeddown{flex-shrink:0;background:var(--t3);color:#fff;border:0;border-radius:var(--r2);padding:6px 10px;font-size:12.5px;cursor:pointer;max-width:46%;text-align:left}.feeddown b{font-weight:600}
.next .lead{font:600 12px var(--cond);color:var(--muted);white-space:nowrap}
.next .what{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.next .when{white-space:nowrap;font-weight:600}
.next.calm .what{color:var(--muted)}
.tools{display:flex;align-items:center;gap:6px}
.chipbtn{border:1px solid var(--rule2);background:none;border-radius:var(--r);padding:4px 9px;font-size:12.5px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.chipbtn:hover{color:var(--text);border-color:var(--muted)}.chipbtn.on{color:var(--text);border-color:var(--t0)}.chipbtn.warn{color:var(--t2);border-color:var(--t2)}
.clocks{display:flex;align-items:baseline;gap:10px;margin-left:6px;white-space:nowrap}
.clocks b{font:600 19px var(--font)}.clocks small{color:var(--muted);font-size:12px}

/* ---------- pane anatomy ---------- */
.ph{display:flex;align-items:center;gap:8px;padding:12px 16px 8px;flex-wrap:wrap}
.ph h1{font:600 18px var(--font);margin:0;margin-right:auto}
.ph .sum{color:var(--muted);font-size:12.5px;width:100%}
.filters{display:flex;gap:5px;flex-wrap:wrap;padding:0 16px 8px}
.fchip{border:1px solid var(--rule2);background:none;border-radius:14px;padding:2px 10px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--raise);color:var(--text);border-color:var(--muted)}
.fchip b{font-weight:600;margin-left:4px;color:var(--text)}
.seg{display:inline-flex;border:1px solid var(--rule2);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:none;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--muted)}.seg button[aria-pressed="true"]{background:var(--raise);color:var(--text)}
.scroll{flex:1;overflow-y:auto;min-height:0;padding:0 8px 16px}
.empty{color:var(--muted);padding:28px 16px;text-align:center;line-height:1.6}
.empty b{display:block;color:var(--text);font-size:14.5px;margin-bottom:2px}
.search{background:var(--panel);border:1px solid var(--rule2);border-radius:var(--r);padding:5px 9px;min-width:0;width:170px}

/* rows: the severity stripe on the left is the only colour */
.row{display:grid;grid-template-columns:4px 1fr auto;gap:0 10px;align-items:start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:9px 8px 9px 0;cursor:pointer;color:var(--text)}
.row:hover{background:var(--panel)}.row[aria-selected="true"]{background:var(--raise)}
.row .bar{align-self:stretch;border-radius:2px;background:var(--rule2)}
.row .bar.t1{background:var(--t1)}.row .bar.t2{background:var(--t2)}.row .bar.t3{background:var(--t3)}.row .bar.t0{background:var(--t0)}
.row .tt{font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.row .mt{color:var(--muted);font-size:12px;margin-top:2px}
.row .rt{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.row .rt b{display:block;font-size:12.5px;color:var(--text)}
.late{color:var(--t3) !important}.soon{color:var(--t2) !important}
.tag{display:inline-block;border:1px solid var(--rule2);border-radius:3px;padding:0 5px;font:500 11.5px var(--cond);color:var(--muted);margin-right:4px;vertical-align:1px}
.pri{display:inline-block;min-width:24px;text-align:center;border-radius:3px;padding:0 4px;font:600 11.5px var(--cond);color:#fff;background:var(--faint);margin-right:6px;vertical-align:1px}
.pri.P1{background:var(--t3)}.pri.P2{background:var(--t2)}.pri.P3{background:var(--t1);color:#1a1a1a}.pri.P4{background:var(--t0)}
.tierword{font:600 12px var(--cond)}.tierword.t0{color:var(--t0)}.tierword.t1{color:var(--t1)}.tierword.t2{color:var(--t2)}.tierword.t3{color:var(--t3)}

/* ---------- detail ---------- */
.detail{padding:4px 16px 24px}
.back{border:0;background:none;color:var(--signal);cursor:pointer;padding:4px 0;font-size:12.5px}
.detail h2{font:600 17px/1.3 var(--font);margin:6px 0 4px}
.facts{display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;margin:10px 0;font-size:12.5px}.facts dt{color:var(--muted)}.facts dd{margin:0}
.prose{color:var(--text);opacity:.92;max-width:68ch}
.sec{margin-top:18px}
.sec > h3{font:600 13px var(--cond);color:var(--muted);margin:0 0 6px;display:flex;align-items:center;gap:8px}
.sec > h3 .r{margin-left:auto}
details.proc,details.crit{border-top:1px solid var(--rule);padding:6px 0}details.proc summary,details.crit summary{cursor:pointer;font-weight:500;padding:2px 0}
details.proc .chk{display:flex;gap:8px;align-items:flex-start;padding:4px 0 4px 4px;line-height:1.4}details.proc .chk input{margin-top:3px}
details.crit{border:0;margin-top:6px}details.crit summary{font-weight:400;color:var(--signal);font-size:13px}details.crit ul,.warnbox ul,.ttp-body ul{margin:4px 0 6px;padding-left:18px}details.crit li,.warnbox li{margin:3px 0}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media (max-width:700px){.cols2{grid-template-columns:1fr}}
.tv{padding:0 16px 16px}.tvframe{position:relative;background:#000;border-radius:var(--r2);overflow:hidden;aspect-ratio:16/9}.tvframe video{width:100%;height:100%;display:block}
.tvmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#e3eaf0;background:rgba(0,0,0,.7);font-size:13.5px;line-height:1.5}.tvmsg a,.tvmsg .linkbtn{color:#8cc4f0}
.cpquick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.cplog{max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.msg{padding:9px 12px;border-radius:var(--r2);line-height:1.5;max-width:92%}.msg.user{align-self:flex-end;background:var(--raise)}.msg.assistant{background:var(--panel);border:1px solid var(--rule)}.msg.err{border-color:var(--t3)}.msg .linkbtn{display:block;margin-top:4px;font-size:12px}
.summary{padding:4px 16px 16px;overflow:auto}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border:1px solid var(--rule);border-radius:var(--r2);background:var(--panel);color:var(--text);text-align:left;cursor:pointer}
.kpi b{font:600 24px var(--font)}.kpi span{font-size:12px;color:var(--muted)}.kpi.hot{border-color:var(--t2);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--t2) 35%,transparent)}}@media (prefers-reduced-motion:reduce){.kpi.hot{animation:none}}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.charts h3{font:600 13px var(--cond);color:var(--muted);margin:0 0 6px}
.bars .b{display:grid;grid-template-columns:minmax(80px,40%) 1fr auto;gap:8px;align-items:center;font-size:12.5px;margin:3px 0}.bars .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .track{height:8px;background:var(--raise);border-radius:4px;overflow:hidden}.bars .track i{display:block;height:100%;background:var(--signal)}.bars .track i.t2{background:var(--t2)}.bars .track i.t3{background:var(--t3)}.bars .v{color:var(--muted);font-variant-numeric:tabular-nums}
.spark{display:flex;align-items:flex-end;gap:2px;height:70px;border-bottom:1px solid var(--rule)}.spark i{flex:1;min-height:1px;background:var(--t0);border-radius:2px 2px 0 0}.spark i.t1{background:var(--t1)}.spark i.t2{background:var(--t2)}.spark i.t3{background:var(--t3)}
@media (max-width:900px){.kpis{grid-template-columns:1fr 1fr}.charts{grid-template-columns:1fr}}
.tcplay{display:flex;flex-direction:column;gap:4px;margin:4px 0 10px}.tcplay input{width:100%}
.stylebar{font-size:12.5px;margin:6px 0 2px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}.stylebar:empty{display:none}
.stylebar .sb-sum{font-weight:600}.stylebar .sb-sum.ok{color:var(--t0)}.stylebar .sb-sum.bad{color:var(--t2)}
.stylebar ul{flex-basis:100%;margin:2px 0 0;padding-left:18px;color:var(--muted)}.stylebar li.error{color:var(--text)}.stylebar li.info{color:var(--muted)}.stylebar .sb-note{flex-basis:100%;margin:2px 0 0;color:var(--muted)}
.exbox{white-space:pre-wrap;font:12.5px/1.5 var(--font);margin:0 11px 8px;max-height:260px;overflow:auto;color:var(--muted)}
.camwrap{display:grid;grid-template-columns:1fr 360px;gap:14px;padding:0 16px 16px;min-height:0}.camgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
.camtile{margin:0;border:1px solid var(--rule);border-radius:var(--r2);overflow:hidden;background:#111}.camslot canvas{display:block;width:100%;height:auto}.camtile figcaption{padding:6px 9px;font-size:12px;background:var(--panel);color:var(--text)}
.camside{border-left:1px solid var(--rule);padding-left:14px;overflow:auto;max-height:calc(100vh - 210px)}.det{border-bottom:1px solid var(--rule);padding:8px 0}.det .dh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.det .dh .bar{width:4px;align-self:stretch;border-radius:2px}
.det .dh .bar.t1{background:var(--t1)}.det .dh .bar.t2{background:var(--t2)}.det .dh .bar.t3{background:var(--t3)}.prose.small{font-size:12.5px;margin:4px 0}
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin:6px 0}.strip img{width:100%;border-radius:3px;display:block}.strip.big{grid-template-columns:repeat(3,1fr)}
.acc{list-style:none;margin:0;padding:0;font-size:12.5px}.acc li{display:grid;grid-template-columns:62px 1fr;gap:0 8px;padding:4px 0;border-bottom:1px solid var(--rule)}.acc li .help{grid-column:2}.acc li.s1 span:first-of-type{color:var(--t1)}.acc li.s2 span:first-of-type{color:var(--t2)}.acc li.s3 span:first-of-type{color:var(--t3);font-weight:600}
.afcanvas{width:100%;border-radius:var(--r2);cursor:crosshair}
@media (max-width:1100px){.camwrap{grid-template-columns:1fr}.camside{border-left:0;padding-left:0;max-height:none}}@media (max-width:700px){.camgrid{grid-template-columns:1fr}}
.warnbox{border-left:3px solid var(--t2);background:color-mix(in srgb,var(--t2) 10%,transparent);padding:8px 12px;margin:8px 0;border-radius:0 var(--r2) var(--r2) 0}
.ttp-h{font:600 13px var(--cond);color:var(--text);margin:16px 0 4px;padding-top:10px;border-top:1px solid var(--rule)}.ttp-sub{font:600 12px var(--cond);color:var(--muted);margin:6px 0 2px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font:600 12px var(--cond);color:var(--muted);border-bottom:1px solid var(--rule2);padding:4px 6px}
.tbl td{border-bottom:1px solid var(--rule);padding:5px 6px;vertical-align:top}
.tbl tr.hot td:first-child{box-shadow:inset 3px 0 var(--t3)}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--rule2);background:var(--panel);border-radius:var(--r);padding:6px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}.btn.primary{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--t3);border-color:color-mix(in srgb,var(--t3) 60%,var(--rule2))}.btn.small{padding:3px 9px;font-size:12.5px}.btn:disabled{opacity:.5;cursor:default}
.linkbtn{border:0;background:none;color:var(--signal);cursor:pointer;padding:0;font-size:12.5px}

/* decision bar in the Inbox */
.decide{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 4px}
.decide .btn{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;padding:7px 10px}
.decide .btn small{color:var(--muted);font-weight:400;font-size:11.5px}.decide .btn.primary small{color:inherit;opacity:.8}
.decide kbd,.kbd{font:500 11px var(--cond);border:1px solid var(--rule2);border-radius:3px;padding:0 4px;color:var(--muted)}
.decide .primary kbd{color:inherit;border-color:currentColor;opacity:.75}

/* timers in an event */
.timers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.timer{border:1px solid var(--rule);border-radius:var(--r2);padding:9px 11px;background:var(--panel)}
.timer .l{font:600 12px var(--cond);color:var(--muted)}.timer .v{font:600 20px var(--font);margin:2px 0}
.timer .gauge{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;margin:6px 0 8px}.timer .gauge i{display:block;height:100%;background:var(--t0)}
.timer.duesoon .v{color:var(--t2)}.timer.duesoon .gauge i{background:var(--t2)}.timer.overdue .v{color:var(--t3)}.timer.overdue .gauge i{background:var(--t3)}
.ren{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.draft{border:1px solid var(--rule);border-radius:var(--r2);background:var(--panel);margin-bottom:8px}
.draft summary{cursor:pointer;padding:8px 11px;font-weight:500;display:flex;gap:8px;align-items:center}.draft summary .s{color:var(--muted);font-weight:400;font-size:12px;margin-left:auto}
.draft textarea{display:block;width:calc(100% - 22px);margin:0 11px;min-height:150px;background:var(--bg);border:1px solid var(--rule2);border-radius:var(--r);padding:8px;resize:vertical;line-height:1.45}
.draft .actions{margin:8px 11px 11px}
.wsel{background:var(--panel);border:1px solid var(--rule2);border-radius:var(--r);padding:2px 4px;font-size:12.5px}
.log{list-style:none;margin:0;padding:0;font-size:12.5px}.log li{display:grid;grid-template-columns:84px 1fr;gap:8px;padding:4px 0;border-bottom:1px solid var(--rule)}.log time{color:var(--muted)}
.note{display:flex;gap:6px;margin-top:8px}.note input{flex:1;background:var(--panel);border:1px solid var(--rule2);border-radius:var(--r);padding:6px 9px}

/* cities */
.cities{display:grid;grid-template-columns:1fr;gap:0}
.city{display:grid;grid-template-columns:4px 112px repeat(5,1fr);gap:0 8px;align-items:center;padding:7px 8px 7px 0;border-bottom:1px solid var(--rule);font-size:12.5px;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.city:hover{background:var(--panel)}.city .bar{align-self:stretch;min-height:26px;border-radius:2px;background:var(--rule2)}.city .bar.t1{background:var(--t1)}.city .bar.t2{background:var(--t2)}.city .bar.t3{background:var(--t3)}.city .bar.t0{background:var(--t0)}.city .n{font-weight:500;font-size:13px}.city .c{color:var(--muted)}.city .c.t1{color:var(--t1)}.city .c.t2{color:var(--t2)}.city .c.t3{color:var(--t3)}
.cityhead{display:grid;grid-template-columns:4px 112px repeat(5,1fr);gap:0 8px;padding:4px 8px 4px 0;font:600 11.5px var(--cond);color:var(--muted);border-bottom:1px solid var(--rule2)}
.region{font:600 12px var(--cond);color:var(--muted);padding:12px 0 4px 12px}

/* reports & settings: full-width documents */
.doc{display:grid;grid-template-columns:260px 1fr;min-height:0;flex:1}
.doc nav{border-right:1px solid var(--rule);overflow-y:auto;padding:8px}
.doc nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:var(--r);cursor:pointer;color:var(--muted)}
.doc nav button[aria-current="true"]{background:var(--raise);color:var(--text)}.doc nav button small{display:block;font-size:11.5px;color:var(--faint)}
.doc nav h4{font:600 12px var(--cond);color:var(--faint);margin:14px 10px 4px}
.doc article{overflow-y:auto;padding:16px 24px 32px;min-width:0}
.doc article h2{font:600 18px var(--font);margin:0 0 4px}
.paper{width:100%;min-height:calc(100vh - 230px);background:var(--panel);border:1px solid var(--rule);border-radius:var(--r2);padding:16px 18px;font:400 13px/1.55 var(--font);white-space:pre-wrap;resize:vertical}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 14px;max-width:960px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
.fld input,.fld select,.fld textarea{background:var(--panel);border:1px solid var(--rule2);border-radius:var(--r);padding:6px 8px;color:var(--text)}
.fld.wide{grid-column:1 / -1}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}.chk input{margin-top:3px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px 12px;max-width:960px}
.help{color:var(--muted);font-size:12.5px;max-width:72ch}
.dot{display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--faint);margin-right:6px;vertical-align:1px}.dot.ok{background:var(--t0)}.dot.bad{background:var(--t3)}.dot.off{background:transparent;border:1px solid var(--faint)}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;z-index:2000;background:rgba(5,12,18,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{background:var(--panel);border:1px solid var(--rule2);border-radius:9px;width:min(640px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.45)}
.dialog.wide{width:min(900px,100%)}
.dialog header{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--rule)}.dialog header h2{font:600 16px var(--font);margin:0;flex:1}
.dialog .body{padding:14px 16px;overflow-y:auto}.dialog footer{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--rule)}
.x{border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--muted)}
.toasts{position:fixed;right:calc(var(--pane) + 14px);bottom:56px;z-index:2600;display:flex;flex-direction:column;gap:6px;width:min(380px,calc(100vw - 28px))}
.toast{background:var(--panel);border:1px solid var(--rule2);border-left:4px solid var(--c,var(--signal));border-radius:var(--r2);padding:9px 12px;box-shadow:0 8px 24px rgba(0,0,0,.35);cursor:pointer;font-size:13px}
.toast b{display:block}
.gate{position:fixed;inset:0;z-index:3000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.gate form{width:min(420px,100%)}.gate h1{font:600 26px var(--font);margin:0}.gate p{color:var(--muted)}
.gate input{width:100%;background:var(--panel);border:1px solid var(--rule2);border-radius:var(--r);padding:10px 12px;font-size:15px;margin:6px 0 12px}
.alarm{position:fixed;inset:0;z-index:2800;background:color-mix(in srgb,var(--t3) 88%,#000);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
.alarm .m{font:600 96px/1 var(--font)}.alarm .p{font:500 24px var(--font);margin:8px 0}.alarm .d{opacity:.9;max-width:60ch;margin:0 auto 22px}
.alarm .btn{background:#fff;color:#111;border-color:#fff;font-size:15px;padding:10px 18px}.alarm .btn.ghost{background:none;color:#fff}

/* map markers */
.mk{border-radius:50%;border:2px solid var(--bg);box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.mk.t0{background:var(--t0)}.mk.t1{background:var(--t1)}.mk.t2{background:var(--t2)}.mk.t3{background:var(--t3)}.mk.sel{box-shadow:0 0 0 3px var(--signal)}
.sitedot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);border:1px solid var(--bg);box-sizing:border-box}
.sitedot.ab{background:#9DB8D4}.sitedot.c{background:#B49BD6}.sitedot.e{background:#7FB6A6;border-radius:1px;transform:rotate(45deg)}.sitedot.o{background:#D7C89A;border-radius:1px}
.sitedot.notlive{background:transparent;border:1.5px dashed var(--muted)}.sitedot.hit{outline:2px solid var(--text);outline-offset:1px}
.lgcls{border:0;background:none;color:inherit;font:inherit;padding:0;cursor:pointer}.lgcls[aria-pressed=false]{opacity:.4;text-decoration:line-through}
.maplegend .sep{width:1px;background:var(--rule2);align-self:stretch}.maplegend .sitedot{margin-right:4px;vertical-align:-1px}
.basesel{position:absolute;right:10px;top:10px;z-index:500;background:var(--panel);color:var(--text);border:1px solid var(--rule2);border-radius:var(--r);padding:3px 6px;font-size:12px}
.leaflet-container{font:inherit;background:var(--bg)}
.leaflet-tooltip{background:var(--panel);color:var(--text);border:1px solid var(--rule2);box-shadow:none;font-size:12.5px}
.leaflet-tooltip-top:before{border-top-color:var(--rule2)}
.leaflet-bar a{background:var(--panel);color:var(--text);border-color:var(--rule2)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 80%,transparent) !important;color:var(--muted) !important}.leaflet-control-attribution a{color:var(--muted) !important}
.maplegend{position:absolute;left:10px;bottom:22px;z-index:500;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--rule);border-radius:var(--r2);padding:5px 9px;font-size:12px;color:var(--muted);display:flex;gap:10px}
.maplegend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}

/* ---------- small screens: map on top, pane below, rail along the bottom ---------- */
@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr 58px;height:100dvh}
  .rail{grid-row:3;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--rule);padding:4px;overflow-x:auto}
  .brand,.rail .gap,.me,.stage.flow + .stage.flow::before{display:none}
  .stage{padding:2px 6px;font-size:11px}.stage .node{min-width:28px;height:28px;font-size:12.5px}
  .top{flex-wrap:wrap;padding:6px 12px;gap:6px}.clocks small,.tools .opt{display:none}
  .work{grid-template-columns:1fr;grid-template-rows:38vh 1fr}.work.full{grid-template-rows:1fr}
  .mapcell{border-right:0;border-bottom:1px solid var(--rule)}
  .doc{grid-template-columns:1fr}.doc nav{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--rule)}.doc nav h4{display:none}.doc nav button{white-space:nowrap;width:auto}
  .decide{grid-template-columns:1fr 1fr}.timers{grid-template-columns:1fr}
  .top .next{order:3;flex-basis:100%;flex-wrap:wrap;gap:2px 8px;padding:4px 0}.top .tools{margin-right:auto}
  .next .what{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;flex-basis:100%;order:3}
  .toasts{bottom:70px;left:12px;right:12px;width:auto}.toast{max-width:none}
  .keyhint{display:none}.rail [data-guide]{display:none}.maplegend .sep,.maplegend .sep ~ span,.maplegend .lgcls{display:none}
  .city,.cityhead{grid-template-columns:4px 90px repeat(3,1fr)}.city .c.x4,.city .c.x5,.cityhead .x4,.cityhead .x5{display:none}
}
@media (hover:none){ .keyhint,.decide kbd{display:none} }
@media print{ .rail,.top,.mapcell,.doc nav,.actions,.toasts{display:none !important} .app,.work,.doc{display:block;height:auto;overflow:visible} .paper{border:0;min-height:0} body{background:#fff;color:#000} }

  var ttp_default = { meta: { version: "2.2", date: "September 23, 2026", owner: "APAC PSOC", recipients: "Datacenter Security Leadership, EHS" }, order: ["air_quality", "protest", "coastal_flooding", "crime", "extreme_heat", "flood", "industrial_hazards", "interstate_conflict", "weather", "pandemic", "power_disruption", "earthquake", "soil_stability", "terrorism", "transportation", "volcanic", "water_supply", "wildfire", "supply_chain", "catastrophic"], ttp: { air_quality: { label: "Air Quality", desc: "Air quality events include haze, wildfire smoke, industrial emissions, particulate pollution, smog, dust storms, and other airborne contaminants that may affect personnel health and welfare, outdoor security duties, patrols, visibility, staff travel, transportation, cooling systems, or datacenter operations.", monitor: ["Monitor air quality when conditions begin to deteriorate but remain below the **UNHEALTHY** threshold, and forecasts indicate further deterioration within the next **24 to 72 hours**"], mgr: { trig: ["AQI, API, or PSI reaches **100 or higher (UNHEALTHY)**", "Authorities issue stay-indoors orders, work-restriction, or public-health emergency advisories"], cad: ["Update every **6 hours**", "Provide an immediate update if AQI, API, or PSI reaches the **VERY UNHEALTHY** category", "Provide an immediate update if public health advisories are issued, expanded, escalated, or lifted"], end: ["Provide a final update when AQI, API, or PSI returns to the **MODERATE** category and remains at that level for **72 hours**"] }, esc: ["Nil"], intel: { trig: ["AQI, API, or PSI reaches **201 or higher (VERY UNHEALTHY)**", "Authorities issue stay-indoors orders, work-restriction, or public-health emergency advisories"], cad: ["Update every **24 hours**", "Provide an immediate update if AQI, API, or PSI reaches the **HAZARDOUS** category (**>300 AQI**)", "Provide an immediate update if public health advisories are issued, expanded, escalated, or lifted"], end: ["Provide ined reporting thresholds"], note: "Air quality may be reported as AQI, API, or PSI depending on the local authority. These indices are not always directly interchangeable; refer to the official local reporting scale before applying SOP thresholds." }, protest: { label: "Civil Unrest", desc: "Civil unrest includes protests, demonstrations, political rallies, labor strikes, riots, road blockades, mass gatherings, and other forms of public disorder that may affect personnel safety, datacenter access, transportation routes, public transit, utilities, vendor movement, datacenter security operations, or business continuity.", monitor: ["Monitor protests, demonstrations, or civil unrest events that have the potential to impact Microsoft datacenters, personnel, site access, transportation routes, critical infrastructure, or cause road closures, traffic disruptions, or other operational impacts"], mgr: { trig: ["Protest activity occurs or is expected within **5 km** of a Microsoft datacenter", "Violence, arson, looting, mass arrests, forced entry, police clashes, or unlawful assembly occurs within **5 km** of a Microsoft datacenter", "Protest activity specifically targets Microsoft, Microsoft datacenters, or the datacenter sector", "ACLED Crowd Size Classification (Large-scale) protest, demonstration, strike, or civil unrest event expected to attract significant attendance and create transportation or access disruptions near a Microsoft site"], cad: ["Provide an immediate update if protest activity escalates", "Provide an immediate update if crowd size increases significantly", "Provide an immediate update if violence, arrests, property damage, or confrontations with law enforcement occur", "Provide an immediate update if road closures, access restrictions, or transportation disruptions affect datacenter access", "Provide an immediate update if impacts to Microsoft personnel, datacenters, or operations are identified"], end: ["Provide a final update when protest activity ha   function start() {
    const boot = () => {
      $("#app").hidden = false;
      initMap();
      render8();
      invalidate();
      setInterval(() => {
        const c = $("#clk");
        if (c) {
          c.textContent = clock(Date.now());
          $("#clku").textContent = (/* @__PURE__ */ new Date()).toISOString().slice(11, 16) + " UTC";
        }
      }, 1e3);
      setInterval(() => {
        const evs = openEvents();
        evs.filter((e) => timers(e).state === "overdue").forEach((e) => desktop("Update overdue: " + e.title, "", "ov:" + e.id + ":" + e.last12 + ":" + e.last24));
        soon();
      }, 3e4);
    };
    if (STATE.me) boot();
    else gate(boot);
  }

  // src/main.js
  var brought = [...migrateFromCurrentConsole() || [], ...migrateData(loadRaw)];
  setRelay(CFG.relay || CFG.server);
  applyCSP();
  rebuildMetros();
  recompute();
  start();
  startSchedule();
  if (load("camRun", false) === true) startSim();
  if (brought.length) setTimeout(() => toast("Brought over from the current console", brought.join(", ") + ". The current console is unchanged.", 0, null, 12e3), 800);
  window.ITE = { STATE, SOURCES, CFG, runSource, map: leafletMap };
})();
</script>
